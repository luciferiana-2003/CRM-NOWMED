<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRM NowMed</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#f4f7fa;--card:#fff;--tx:#1b2733;--mut:#667685;--line:#d9e1e8;--navy:#29266b;--teal:#0b8fa8;--soft:#eaf2f8;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#12181f;--card:#1b242d;--tx:#e8eef3;--mut:#93a3b1;--line:#2d3a46;--navy:#3a3790;--teal:#0b8fa8;--soft:#223241;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 Arial,sans-serif}
header{background:var(--navy);color:#fff;padding:12px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1;min-width:140px}
button,select,input,textarea{font:inherit;color:var(--tx)}
.btn,nav button{border:1px solid var(--line);background:var(--card);padding:7px 12px;border-radius:8px;cursor:pointer}
nav{display:flex;gap:6px;flex-wrap:wrap}nav button.on,.btn.p{background:var(--teal);border-color:var(--teal);color:#fff;font-weight:bold}
main{max-width:1250px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:14px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea{padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--card);min-width:0}
.wrap{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:760px}
th{background:var(--navy);color:#fff;text-align:left;padding:8px;font-size:12px;white-space:nowrap}
td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tg{padding:2px 8px;border-radius:10px;font-size:12px;font-weight:bold;white-space:nowrap;background:var(--soft)}
.e0{background:#e5e7eb;color:#374151}.e1{background:#d6eaf8;color:#1b4f72}.e2{background:#e8daef;color:#5b2c6f}.e3{background:#fdebd0;color:#9c640c}.e4{background:#d5f5e3;color:#1e8449}.e5{background:#d5f5e3;color:#1e8449}.e6{background:#fadbd8;color:#922b21}
.Agendada{background:#d6eaf8;color:#1b4f72}.Realizada{background:#d5f5e3;color:#1e8449}.Cancelada{background:#fadbd8;color:#922b21}.Remarcada{background:#fdebd0;color:#9c640c}
.late{color:#c0392b;font-weight:bold}.hide{display:none}.note{font-size:12px;color:var(--mut)}.empty{text-align:center;color:var(--mut);padding:22px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--soft);border-radius:10px;padding:12px;text-align:center}.kpi b{display:block;font-size:26px}.kpi span{font-size:12px;color:var(--mut)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px}h2{font-size:15px;margin:0 0 10px}
.hb{display:flex;align-items:center;gap:8px;margin:6px 0}.hb i{width:120px;font-style:normal;font-size:12px}.hb div{flex:1;background:var(--soft);border-radius:4px;height:20px}.hb span{display:block;height:100%;border-radius:4px;background:var(--teal)}
.mo{display:flex;align-items:flex-end;gap:6px;height:150px}.mo div{flex:1;text-align:center;font-size:11px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;height:100%}.mo span{display:block;background:var(--teal);border-radius:3px 3px 0 0}
.kb{display:flex;gap:10px;overflow-x:auto;align-items:flex-start;padding-bottom:10px}.col{min-width:200px;flex:1;background:var(--soft);border-radius:10px;padding:8px}
.col h3{font-size:13px;margin:2px 4px 8px}.kc{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px;cursor:pointer}.kc small{display:block;color:var(--mut)}.kc button{margin:6px 4px 0 0;padding:2px 10px}
.ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9;align-items:center;justify-content:center;padding:12px;overflow:auto}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}label{font-size:12px;color:var(--mut);display:flex;flex-direction:column;gap:4px}.w{grid-column:1/-1}
body.nog select[onchange*="F.r="],body.nog select[onchange*="'r'"]{display:none}
header{position:fixed;left:0;top:0;bottom:0;width:190px;flex-direction:column;align-items:stretch;padding:16px 10px;gap:14px;z-index:5}
header h1{flex:none;font-size:17px;padding:0 6px}nav{flex-direction:column;flex:1}
nav button{background:transparent;border:0;color:#cfe0f3;text-align:left;padding:10px 12px;border-radius:8px}
nav button.on{background:rgba(255,255,255,.18);color:#fff}#so{margin-top:auto}main{margin-left:190px}
.col{min-width:220px}.ch{display:flex;justify-content:space-between;gap:6px;padding:6px 8px;border-radius:6px;margin-bottom:8px;font-size:12px}
.kc:hover{box-shadow:0 2px 8px rgba(0,0,0,.18)}.kf{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.av{width:24px;height:24px;border-radius:50%;background:var(--navy);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:bold}
.dt{font-size:11px;padding:1px 6px;border-radius:8px;background:var(--soft)}.dt.r{background:#fadbd8;color:#922b21}.dt.y{background:#fcf3cf;color:#7d6608}.dt.g{background:#d5f5e3;color:#1e8449}
@media(max-width:760px){header{position:static;width:auto;flex-direction:row;flex-wrap:wrap;padding:10px}nav{flex-direction:row;flex-wrap:wrap}#so{margin-top:0}main{margin-left:0}}
.brand{padding:4px 6px}.brand img{width:140px;display:block}.brand small{display:block;letter-spacing:3px;color:#07e9f7;font-weight:bold;font-size:11px;margin-top:4px}
.mascot{width:120px;align-self:center;margin-top:auto;border-radius:12px}
#lo{background:#29266b;flex-direction:column;gap:14px}#lo .mas{width:130px;border-radius:14px}#lo .lg{width:210px}
@media(max-width:760px){.mascot{display:none}.brand img{width:110px}}
</style></head><body>
